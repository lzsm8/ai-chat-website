<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chat · DeepSeek</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <span class="brand-dot"></span>
          <span class="brand-name">AI Chat</span>
        </div>
        <button class="icon-btn" id="sidebarToggle" title="收起侧边栏">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg>
        </button>
      </div>

      <button class="new-chat-btn" id="newChatBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        新建对话
      </button>

      <div class="history-label">最近对话</div>
      <nav class="history-list" id="historyList"></nav>

      <div class="sidebar-footer">
        <div class="model-badge" title="当前模型">
          <span class="pulse"></span> deepseek-v4-pro
        </div>
      </div>
    </aside>

    <!-- 主区域 -->
    <main class="main">
      <header class="topbar">
        <button class="icon-btn mobile" id="mobileMenuBtn" title="菜单">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="topbar-title" id="conversationTitle">新对话</div>
        <div class="topbar-actions">
          <div class="personality-picker">
            <button class="personality-current" id="personalityBtn" title="切换角色性格">
              <span class="p-emoji" id="pCurrentEmoji">🎀</span>
              <span class="p-name" id="pCurrentName">温柔</span>
              <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <div class="personality-menu" id="personalityMenu"></div>
          </div>
          <button class="icon-btn" id="clearBtn" title="清空当前对话">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
          </button>
        </div>
      </header>

      <div class="chat-scroll" id="chatScroll">
        <div class="chat-container" id="chatContainer">
          <!-- 欢迎页 -->
          <div class="welcome" id="welcome">
            <div class="welcome-logo" id="welcomeLogo">✦</div>
            <h1>你好，我是 DeepSeek</h1>
            <p class="welcome-sub">先选一个性格，我会用对应的语气和你聊天</p>
            <div class="personality-grid" id="personalityGrid"></div>
            <div class="suggestions" id="suggestions">
              <button class="suggestion">帮我写一段 Python 代码</button>
              <button class="suggestion">解释一下什么是神经网络</button>
              <button class="suggestion">帮我润色一段文案</button>
              <button class="suggestion">给我讲个冷笑话</button>
            </div>
          </div>
          <div id="messages"></div>
        </div>
      </div>

      <div class="composer-wrap">
        <div class="composer">
          <textarea id="input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
          <div class="composer-footer">
            <span class="hint">AI 生成内容仅供参考</span>
            <button class="send-btn" id="sendBtn" title="发送">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22 11 13 2 9l20-7z"/></svg>
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.6.8/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.9/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/common.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
